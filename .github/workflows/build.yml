name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config }}
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to its commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      # The runner image ships an older CMake than the project requires. Pin
      # one release and verify the official SHA-256 before extracting.
      - name: Install CMake 4.4.4
        shell: pwsh
        run: |
          $version = '4.4.4'
          $sha256 = 'bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536'
          $url = "https://github.com/Kitware/CMake/releases/download/v$version/cmake-$version-windows-x86_64.zip"
          Write-Host "Installing CMake $version from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cmake.zip"
          $actual = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\cmake.zip").Hash.ToLower()
          if ($actual -ne $sha256) { throw "CMake zip checksum mismatch: $actual" }
          Expand-Archive -Path "$env:RUNNER_TEMP\cmake.zip" -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          "$env:RUNNER_TEMP\cmake\cmake-$version-windows-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check formatting
        if: matrix.config == 'Debug'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check clang-format==22.1.3
          $cf = python -c "import clang_format, pathlib; print(pathlib.Path(clang_format.__file__).parent / 'data' / 'bin' / 'clang-format.exe')"
          if (-not (Test-Path $cf)) { throw "clang-format.exe not found at $cf" }
          $files = @(git ls-files '*.cpp' '*.h' | Where-Object {
            $_ -notmatch '^thirdparty/'
          })
          if ($files.Count -eq 0) { Write-Host 'no first-party C++ files'; exit 0 }
          & $cf --dry-run --Werror --style=file @files

      - name: Configure
        # The CMake presets pin one Visual Studio generation; pick the
        # generator matching the instance actually installed on the runner
        # and point CMake at it explicitly.
        run: |
          cmake --version
          $generator = $null
          $instance = $null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "vswhere present: $(Test-Path $vswhere)"
          if (Test-Path $vswhere) {
            $instances = & $vswhere -all -prerelease -products * -format json | ConvertFrom-Json
            $instances | ForEach-Object { Write-Host "VS $($_.installationVersion) at $($_.installationPath)" }
            $latest = $instances | Sort-Object { [int]($_.installationVersion.Split('.')[0]) } -Descending | Select-Object -First 1
            if ($latest) {
              $instance = $latest.installationPath
              $major = [int]$latest.installationVersion.Split('.')[0]
              if ($major -ge 18) { $generator = 'Visual Studio 18 2026' } else { $generator = 'Visual Studio 17 2022' }
            }
          }
          if (-not $generator) { $generator = 'Visual Studio 17 2022' }
          Write-Host "Generating with '$generator' (instance: '$instance')"
          if ($instance) {
            cmake -S . -B build/ci -G $generator -A Win32 -DCMAKE_GENERATOR_INSTANCE="$instance"
          } else {
            cmake -S . -B build/ci -G $generator -A Win32
          }

      - name: Build (${{ matrix.config }})
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel
